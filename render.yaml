services:
  - type: web
    name: mehadee-hassan-portfolio
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    preDeployCommand: npm run seed
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /opt/render/project/src/data/portfolio.sqlite
      - key: UPLOADS_DIR
        value: /opt/render/project/src/data/uploads
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MEDIA_STORAGE_PROVIDER
        value: local
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
    disk:
      name: portfolio-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
